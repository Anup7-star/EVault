[package]
name        = "evault-backend"
version     = "0.1.0"
edition     = "2021"
description = "EVault off-chain backend — axum HTTP API + sqlx/Postgres"

# ── Runtime ──────────────────────────────────────────────────────────────────
[dependencies]
tokio          = { version = "1",    features = ["full"] }

# ── HTTP ─────────────────────────────────────────────────────────────────────
axum           = { version = "0.7",  features = ["macros"] }
tower-http     = { version = "0.5", features = ["trace", "cors", "request-id", "timeout", "util"] }

# ── Database ─────────────────────────────────────────────────────────────────
sqlx           = { version = "0.8",  features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
] }

# ── Serialisation ─────────────────────────────────────────────────────────────
serde          = { version = "1",    features = ["derive"] }
serde_json     = "1"

# ── Identifiers & time ────────────────────────────────────────────────────────
uuid           = { version = "1",    features = ["v4", "serde"] }
chrono         = { version = "0.4",  features = ["serde"] }

# ── Observability ─────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ── Config ───────────────────────────────────────────────────────────────────
dotenvy        = "0.15"

# ── Error handling ────────────────────────────────────────────────────────────
anyhow         = "1"
thiserror      = "1"
siwe = "0.6.1"
ethers = "2.0.4"
rand = "0.8"
sha2 = "0.11.0"
hex = "0.4.3"
# Pinned to 9.3.0 because v11+ requires explicit CryptoProvider initialization which complicates tests
jsonwebtoken = "9.3.0"
time = "0.3.36"
tower = "0.5.3"
http-body-util = "0.1.5"
aes-gcm = "0.11.1"

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
