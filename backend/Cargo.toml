[package]
name        = "evault-backend"
version     = "0.1.0"
edition     = "2021"
description = "EVault off-chain backend — axum HTTP API + sqlx/Postgres"

# ── Runtime ──────────────────────────────────────────────────────────────────
[dependencies]
tokio          = { version = "1",    features = ["full"] }

# ── HTTP ─────────────────────────────────────────────────────────────────────
axum           = { version = "0.7",  features = ["macros"] }
tower-http     = { version = "0.5",  features = ["trace", "cors", "request-id", "timeout"] }

# ── Database ─────────────────────────────────────────────────────────────────
sqlx           = { version = "0.8",  features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
] }

# ── Serialisation ─────────────────────────────────────────────────────────────
serde          = { version = "1",    features = ["derive"] }
serde_json     = "1"

# ── Identifiers & time ────────────────────────────────────────────────────────
uuid           = { version = "1",    features = ["v4", "serde"] }
chrono         = { version = "0.4",  features = ["serde"] }

# ── Observability ─────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ── Config ───────────────────────────────────────────────────────────────────
dotenvy        = "0.15"

# ── Error handling ────────────────────────────────────────────────────────────
anyhow         = "1"
thiserror      = "1"
